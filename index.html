<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f6f2ec">
  <title>来而有往 · 初版原型</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2218%22 fill=%22%2326322f%22/><text x=%2232%22 y=%2243%22 text-anchor=%22middle%22 font-size=%2234%22 fill=%22white%22>来</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <div class="prototype-shell">
    <aside class="prototype-note">
      <div class="brand-lockup">
        <div class="brand-mark">来</div>
        <div>
          <strong id="brandName">来而有往</strong>
          <span id="brandTagline">关系付出记录与提醒</span>
        </div>
      </div>
      <h1 id="brandHeadline">你的每一份付出，<br>都值得被尊重。</h1>
      <p id="brandIntro">只记录事实，只在额度、次数或持续月份达到你设定的提醒线时提示。如何理解、是否行动，都由你决定。</p>
      <div class="prototype-points">
        <span><i>1</i> <b id="pointOne">记录自己的付出</b></span>
        <span><i>2</i> <b id="pointTwo">看见额度与持续模式</b></span>
        <span><i>3</i> <b id="pointThree">自主决定下一步</b></span>
      </div>
      <div class="privacy-note" id="localOnlyNote">初版数据仅保存在当前浏览器中</div>
    </aside>

    <main class="phone-frame" aria-label="来而有往原型">
      <header class="app-header">
        <div>
          <small id="todayLabel"></small>
          <h2 id="pageTitle">今天，也照顾好自己</h2>
        </div>
        <div class="header-actions">
          <button class="language-button" data-action="toggle-language" aria-label="Switch language">EN</button>
          <button class="avatar-button" data-action="show-privacy" aria-label="隐私说明">私</button>
        </div>
      </header>

      <section id="appView" class="app-view" aria-live="polite"></section>

      <nav class="bottom-nav" aria-label="主导航">
        <button class="nav-item active" data-page="home">
          <span class="nav-icon">⌂</span><span data-nav-label="home">今天</span>
        </button>
        <button class="nav-item" data-page="records">
          <span class="nav-icon">≡</span><span data-nav-label="records">记录</span>
        </button>
        <button class="add-fab" data-action="open-entry-menu" aria-label="选择记录方式">＋</button>
        <button class="nav-item" data-page="clarify">
          <span class="nav-icon">◇</span><span data-nav-label="clarify">说清</span>
        </button>
        <button class="nav-item" data-page="me">
          <span class="nav-icon">○</span><span data-nav-label="me">我的</span>
        </button>
      </nav>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status"></div>

  <script src="legal-content.js"></script>
  <script src="app.js"></script>
</body>
</html>
